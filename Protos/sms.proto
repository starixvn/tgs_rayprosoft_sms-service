syntax = "proto3";

option csharp_namespace = "Tgs.Sms.Protos";
package sms;

import "phoenix/protobuf/guid.proto";

message ShortMessage {
    string destination = 1;
    string content = 2;
    phoenix.protobuf.GuidValue brand_id = 3;
    optional string area_code = 4;
    optional string phone = 5;
}
