apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "sms-api.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}"
      },
      "Sms": {
        "RabbitMQUrl": "{{ .Values.rabbit.url }}"
      }
    }
