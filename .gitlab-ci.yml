include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/sms-service
  MockImageName: pgtgs/sms-mock
  TgsSettingKey: sms-service
  HelmTemplateFolderName: sms-api
  BuildCacheKey: Tgs.SmsService.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "SmsReceiver"
    - push_package "SmsServiceClient"
  artifacts:
    paths:
      - SmsServiceClient/bin/$BuildConfiguration/*.nupkg
      - SmsReceiver/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "SmsService" $ImageName $Tag
    - push_docker "Tgs.Sms.Mock" $MockImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateFolderName
    - push_k8s_template 'sms-mock'

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success

deploy-mock-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: mock-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s 'sms-mock' 'sms-mock' $namespace

deploy-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual

deploy-mock-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: mock-staging
  stage: deploy-staging
  needs:
    - deploy-mock-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s 'sms-mock' 'sms-mock' $namespace

deploy-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual

deploy-mock-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: mock-prod
  stage: deploy-prod
  needs:
    - deploy-mock-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s 'sms-mock' 'sms-mock' $namespace
